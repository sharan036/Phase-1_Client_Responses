<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase-1 Client Requirements Questionnaire</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F7F8FA; --surface: #FFFFFF; --border: #E2E6ED;
    --accent: #2563EB; --accent-light: #EFF4FF;
    --text-primary: #111827; --text-secondary: #6B7280; --text-muted: #9CA3AF;
    --tag-bg: #F1F5F9; --tag-text: #475569;
    --mono: 'JetBrains Mono', monospace;
  }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-primary); min-height: 100vh; padding: 0; }

  /* HEADER */
  .header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 16px 40px; position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .header-left { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
  .header-logo { width: 38px; height: 38px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; }
  .header-title { font-size: 16px; font-weight: 600; color: var(--text-primary); }
  .header-sub { font-size: 13px; color: var(--text-secondary); margin-top: 1px; }

  /* LANG TOGGLE */
  .lang-toggle { display: flex; align-items: center; gap: 6px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 4px; }
  .lang-btn {
    padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 500;
    cursor: pointer; border: none; background: transparent; color: var(--text-secondary);
    transition: all 0.15s; white-space: nowrap;
  }
  .lang-btn.active { background: var(--accent); color: #fff; }
  .lang-btn:hover:not(.active) { background: var(--border); color: var(--text-primary); }

  .progress-wrap { display: flex; align-items: center; gap: 10px; }
  .progress-label { font-size: 13px; color: var(--text-secondary); white-space: nowrap; }
  .progress-bar { width: 130px; height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.3s ease; width: 0%; }
  .progress-count { font-size: 13px; font-weight: 600; color: var(--accent); font-family: var(--mono); white-space: nowrap; }

  /* LAYOUT */
  .layout { display: flex; min-height: calc(100vh - 73px); }
  .sidebar { width: 260px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); padding: 24px 0; position: sticky; top: 73px; height: calc(100vh - 73px); overflow-y: auto; }
  .sidebar-label { font-size: 11px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.08em; text-transform: uppercase; padding: 0 20px 10px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 20px; cursor: pointer; border-left: 3px solid transparent; transition: all 0.15s; color: var(--text-secondary); font-size: 13.5px; }
  .nav-item:hover { background: var(--bg); color: var(--text-primary); }
  .nav-item.active { border-left-color: var(--accent); background: var(--accent-light); color: var(--accent); font-weight: 500; }
  .nav-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); flex-shrink: 0; transition: background 0.2s; }
  .nav-item.done .nav-dot { background: #10B981; }
  .nav-item.active .nav-dot { background: var(--accent); }
  .nav-count { margin-left: auto; font-size: 11px; font-family: var(--mono); color: var(--text-muted); }

  .main { flex: 1; padding: 36px 48px; max-width: 820px; }
  .section { display: none; } .section.active { display: block; }
  .section-header { margin-bottom: 28px; }
  .section-eyebrow { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--accent); background: var(--accent-light); padding: 4px 10px; border-radius: 99px; margin-bottom: 10px; }
  .section-title { font-size: 22px; font-weight: 700; color: var(--text-primary); margin-bottom: 6px; }
  .section-desc { font-size: 14px; color: var(--text-secondary); line-height: 1.6; }

  .q-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px 22px; margin-bottom: 16px; transition: border-color 0.15s; }
  .q-card:focus-within { border-color: var(--accent); }
  .q-top { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
  .q-num { font-size: 11px; font-weight: 700; font-family: var(--mono); color: var(--accent); background: var(--accent-light); padding: 3px 8px; border-radius: 5px; flex-shrink: 0; margin-top: 2px; }
  .q-text { font-size: 14.5px; font-weight: 500; color: var(--text-primary); line-height: 1.5; }
  .q-required { color: #EF4444; margin-left: 3px; }
  .q-hint { font-size: 12.5px; color: var(--text-secondary); margin-top: 4px; line-height: 1.5; }

  textarea, input[type="text"], input[type="email"], input[type="number"], select {
    width: 100%; font-family: 'Inter', sans-serif; font-size: 13.5px; color: var(--text-primary);
    background: var(--bg); border: 1px solid var(--border); border-radius: 7px;
    padding: 10px 14px; outline: none; transition: border-color 0.15s, box-shadow 0.15s; resize: vertical;
  }
  textarea:focus, input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); background: #fff; }
  textarea { min-height: 90px; }

  .radio-group, .check-group { display: flex; flex-direction: column; gap: 8px; }
  .option-btn { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 7px; cursor: pointer; font-size: 13.5px; color: var(--text-primary); background: var(--bg); transition: all 0.15s; user-select: none; }
  .option-btn:hover { border-color: var(--accent); background: var(--accent-light); }
  .option-btn.selected { border-color: var(--accent); background: var(--accent-light); color: var(--accent); font-weight: 500; }
  .option-btn input { display: none; }
  .option-indicator { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; }
  .option-btn.selected .option-indicator { border-color: var(--accent); background: var(--accent); }
  .option-indicator::after { content:''; width:6px; height:6px; border-radius:50%; background:#fff; display:none; }
  .option-btn.selected .option-indicator::after { display:block; }
  .check-indicator { width: 16px; height: 16px; border-radius: 4px; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; }
  .option-btn.check-btn.selected .check-indicator { border-color: var(--accent); background: var(--accent); }
  .check-indicator::after { content:'✓'; color:#fff; font-size:10px; font-weight:700; display:none; }
  .option-btn.check-btn.selected .check-indicator::after { display:block; }

  .btn-row { display: flex; align-items: center; justify-content: space-between; margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border); }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 22px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; transition: all 0.15s; }
  .btn-ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--bg); color: var(--text-primary); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #1D4ED8; }
  .btn-success { background: #10B981; color: #fff; }
  .btn-success:hover { background: #059669; }

  .summary-section { display: none; } .summary-section.active { display: block; }
  .summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 20px; overflow: hidden; }
  .summary-card-header { padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--bg); font-size: 14px; font-weight: 600; }
  .summary-card-body { padding: 16px 20px; }
  .summary-row { display: flex; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--bg); font-size: 13.5px; }
  .summary-row:last-child { border-bottom: none; }
  .summary-q { color: var(--text-secondary); width: 44%; flex-shrink: 0; line-height: 1.5; }
  .summary-a { color: var(--text-primary); font-weight: 500; line-height: 1.5; }
  .export-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 28px; }

  /* GOOGLE SHEET STATUS */
  .sheet-status {
    display: none; align-items: center; gap: 10px;
    padding: 12px 16px; border-radius: 8px; font-size: 13.5px;
    margin-bottom: 16px; border: 1px solid var(--border);
  }
  .sheet-status.visible { display: flex; }
  .sheet-status.loading { background: #EFF4FF; border-color: #BFDBFE; color: #1D4ED8; }
  .sheet-status.success { background: #ECFDF5; border-color: #A7F3D0; color: #065F46; }
  .sheet-status.error   { background: #FEF2F2; border-color: #FECACA; color: #991B1B; }
  .sheet-link { font-weight: 600; text-decoration: underline; color: inherit; }
  .btn-google { background: #fff; color: #374151; border: 1px solid var(--border); display: inline-flex; align-items: center; gap: 8px; }
  .btn-google:hover { background: var(--bg); border-color: #9CA3AF; }
  .btn-google svg { flex-shrink: 0; }

  @media (max-width: 768px) {
    .sidebar { display: none; }
    .main { padding: 24px 20px; }
    .header { padding: 12px 16px; flex-wrap: wrap; }
    .progress-wrap { display: none; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-logo">📋</div>
    <div>
      <div class="header-title" id="hTitle">Phase-1 Requirements Questionnaire</div>
      <div class="header-sub">Dev Innovations Labs · Client Discovery</div>
    </div>
  </div>
  <div class="lang-toggle">
    <button class="lang-btn active" onclick="setLang('en')">EN</button>
    <button class="lang-btn" onclick="setLang('hi')">हिंदी</button>
    <button class="lang-btn" onclick="setLang('pa')">ਪੰਜਾਬੀ</button>
  </div>
  <div class="progress-wrap">

    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-count" id="progressCount">0 / 8</div>
  </div>
</div>

<div class="layout">
  <div class="sidebar"><div class="sidebar-label" id="sidebarLabel">Sections</div><div id="navList"></div></div>
  <div class="main" id="mainContent"></div>
</div>

// ─── STATE ────────────────────────────────────────────────────────────────────
const answers = {};
let current = 0;
let lang = 'en';

// ─── LANG SWITCH ──────────────────────────────────────────────────────────────
function setLang(l) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.textContent.trim() === (l==='en'?'EN':l==='hi'?'हिंदी':'ਪੰਜਾਬੀ')));
  document.getElementById('hTitle').textContent = T[l].headerTitle;
  document.getElementById('progLabel').textContent = T[l].progress;
  document.getElementById('sidebarLabel').textContent = T[l].sections;
  // Rebuild all sections with new language
  document.getElementById('mainContent').innerHTML = '';
  document.getElementById('navList').innerHTML = '';
  buildAll();
  goTo(current);
}

// ─── BUILD ────────────────────────────────────────────────────────────────────
function buildAll() {
  const navList = document.getElementById('navList');
  SECTIONS.forEach((sec, i) => {
    const el = document.createElement('div');
    el.className = 'nav-item' + (i===current?' active':'') + (i<current?' done':'');
    el.id = 'nav-'+i;
    el.innerHTML = `<span class="nav-dot"></span><span>${sec.icon} ${sec.label[lang]}</span><span class="nav-count">${sec.questions.length}</span>`;
    el.addEventListener('click', () => goTo(i));
    navList.appendChild(el);
  });

  const main = document.getElementById('mainContent');
  SECTIONS.forEach((sec, idx) => {
    const div = document.createElement('div');
    div.className = 'section' + (idx===current?' active':'');
    div.id = 'sec-'+idx;
    div.innerHTML = `
      <div class="section-header">
        <div class="section-eyebrow">${sec.icon} ${T[lang].sectionOf(idx+1, SECTIONS.length)}</div>
        <div class="section-title">${sec.label[lang]}</div>
        <div class="section-desc">${sec.desc[lang]}</div>
      </div>
    `;
    sec.questions.forEach(q => {
      const card = document.createElement('div');
      card.className = 'q-card';
      const hint = q.hint ? q.hint[lang] : '';
      card.innerHTML = `
        <div class="q-top">
          <div class="q-num">${q.id.slice(1).toUpperCase()}</div>
          <div>
            <div class="q-text">${q.text[lang]}${q.required?'<span class="q-required">*</span>':''}</div>
            ${hint?`<div class="q-hint">${hint}</div>`:''}
          </div>
        </div>
        <div class="q-input" id="input-${q.id}"></div>
      `;
      div.appendChild(card);
      setTimeout(() => renderInput(q), 0);
    });

    const btnRow = document.createElement('div');
    btnRow.className = 'btn-row';
    btnRow.innerHTML = `
      ${idx>0?`<button class="btn btn-ghost" onclick="goTo(${idx-1})">${T[lang].back}</button>`:'<span></span>'}
      ${idx<SECTIONS.length-1
        ? `<button class="btn btn-primary" onclick="goTo(${idx+1})">${T[lang].next}</button>`
        : `<button class="btn btn-success" onclick="showSummary()">${T[lang].reviewSubmit}</button>`
      }
    `;
    div.appendChild(btnRow);
    main.appendChild(div);
  });

  const summaryDiv = document.createElement('div');
  summaryDiv.className = 'summary-section';
  summaryDiv.id = 'sec-summary';
  main.appendChild(summaryDiv);
}

function renderInput(q) {
  const wrap = document.getElementById('input-'+q.id);
  if (!wrap) return;
  const hint = q.hint ? q.hint[lang] : '';

  if (q.type === 'text') {
    const inp = document.createElement('input');
    inp.type = 'text'; inp.id = 'field-'+q.id;
    inp.placeholder = hint || T[lang].placeholder;
    inp.value = answers[q.id] || '';
    inp.addEventListener('input', () => { answers[q.id] = inp.value; updateProgress(); });
    wrap.appendChild(inp);
  } else if (q.type === 'textarea') {
    const ta = document.createElement('textarea');
    ta.id = 'field-'+q.id;
    ta.placeholder = hint || T[lang].placeholder;
    ta.value = answers[q.id] || '';
    ta.addEventListener('input', () => { answers[q.id] = ta.value; updateProgress(); });
    wrap.appendChild(ta);
  } else if (q.type === 'radio') {
    const grp = document.createElement('div');
    grp.className = 'radio-group';
    (q.options[lang]||[]).forEach((opt, oi) => {
      const enOpt = q.options['en'][oi];
      const btn = document.createElement('label');
      btn.className = 'option-btn' + (answers[q.id]===enOpt?' selected':'');
      btn.innerHTML = `<input type="radio" name="${q.id}" value="${enOpt}"><span class="option-indicator"></span>${opt}`;
      btn.addEventListener('click', () => {
        answers[q.id] = enOpt;
        grp.querySelectorAll('.option-btn').forEach(b=>b.classList.remove('selected'));
        btn.classList.add('selected');
        updateProgress();
      });
      grp.appendChild(btn);
    });
    wrap.appendChild(grp);
  } else if (q.type === 'checkbox') {
    const grp = document.createElement('div');
    grp.className = 'check-group';
    const sel = answers[q.id] ? answers[q.id].split(',').filter(Boolean) : [];
    (q.options[lang]||[]).forEach((opt, oi) => {
      const enOpt = q.options['en'][oi];
      const btn = document.createElement('label');
      btn.className = 'option-btn check-btn' + (sel.includes(enOpt)?' selected':'');
      btn.innerHTML = `<span class="check-indicator"></span>${opt}`;
      btn.addEventListener('click', () => {
        const cur = answers[q.id] ? answers[q.id].split(',').filter(Boolean) : [];
        const idx = cur.indexOf(enOpt);
        if (idx>=0) { cur.splice(idx,1); btn.classList.remove('selected'); }
        else { cur.push(enOpt); btn.classList.add('selected'); }
        answers[q.id] = cur.join(',');
        updateProgress();
      });
      grp.appendChild(btn);
    });
    wrap.appendChild(grp);
  }
}

function goTo(idx) {
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.summary-section').forEach(s=>s.classList.remove('active'));
  document.getElementById('sec-'+idx)?.classList.add('active');
  document.querySelectorAll('.nav-item').forEach((n,i)=>{
    n.classList.toggle('active', i===idx);
    if(i<idx) n.classList.add('done'); else if(i>idx) n.classList.remove('done');
  });
  current = idx;
  window.scrollTo({top:0, behavior:'smooth'});
}

function showSummary() {
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const div = document.getElementById('sec-summary');
  div.innerHTML = `
    <div class="section-header">
      <div class="section-eyebrow">✅ ${T[lang].reviewTitle}</div>
      <div class="section-title">${T[lang].reviewTitle}</div>
      <div class="section-desc">${T[lang].reviewDesc}</div>
    </div>
    <div class="export-bar">
      <button class="btn btn-primary" id="copyBtn" onclick="copyToClipboard()">${T[lang].copyBtn}</button>
      <button class="btn btn-google" id="sheetBtn" onclick="saveToSheet()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" fill="#0F9D58"/><path d="M7 8h10M7 12h10M7 16h6" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg>
        Save to Google Sheet
      </button>
      <button class="btn btn-ghost" onclick="goTo(0)">${T[lang].editBtn}</button>
    </div>
    <div class="sheet-status" id="sheetStatus"></div>
    <div id="summary-body"></div>
  `;
  div.classList.add('active');
  const body = document.getElementById('summary-body');
  SECTIONS.forEach(sec => {
    const card = document.createElement('div');
    card.className = 'summary-card';
    let rows = '';
    sec.questions.forEach(q => {
      const val = answers[q.id];
      if (!val) return;
      let displayVal = val;
      if (q.options && q.options[lang]) {
        const enOpts = q.options['en'];
        const localOpts = q.options[lang];
        displayVal = val.split(',').map(v => {
          const i = enOpts.indexOf(v.trim());
          return i>=0 ? localOpts[i] : v;
        }).join(', ');
      }
      rows += `<div class="summary-row"><div class="summary-q">${q.text[lang]}</div><div class="summary-a">${displayVal}</div></div>`;
    });
    if (!rows) rows = `<div class="summary-row"><div class="summary-q" style="color:var(--text-muted)">${T[lang].noAnswers}</div></div>`;
    card.innerHTML = `<div class="summary-card-header">${sec.icon} ${sec.label[lang]}</div><div class="summary-card-body">${rows}</div>`;
    body.appendChild(card);
  });
}

function copyToClipboard() {
  let text = `${T[lang].copyHeader}\n${'='.repeat(52)}\n\n`;
  SECTIONS.forEach(sec => {
    text += `[${sec.label[lang].toUpperCase()}]\n${'-'.repeat(40)}\n`;
    sec.questions.forEach(q => {
      const val = answers[q.id];
      if (!val) return;
      let displayVal = val;
      if (q.options && q.options[lang]) {
        const enOpts = q.options['en'];
        const localOpts = q.options[lang];
        displayVal = val.split(',').map(v => { const i=enOpts.indexOf(v.trim()); return i>=0?localOpts[i]:v; }).join(', ');
      }
      text += `${q.text[lang]}\n→ ${displayVal}\n\n`;
    });
  });
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = T[lang].copied;
    setTimeout(()=>btn.textContent=T[lang].copyBtn, 2000);
  });
}

    '📋 Paste your Google Apps Script Web App URL below.\n\n' +
    'Steps to get it:\n' +
    '1. Open your Google Sheet → Extensions → Apps Script\n' +
    '2. Paste the script → Save\n' +
    '3. Deploy → New Deployment → Web App\n' +
    '   Execute as: Me | Who has access: Anyone\n' +
    '4. Copy the Web App URL and paste here.',
    current
  );
  if (url && url.trim().startsWith('https://script.google.com')) {
    SCRIPT_URL = url.trim();
    try { localStorage.setItem('dil_script_url', SCRIPT_URL); } catch(e){}
    return true;
  } else if (url !== null) {
    alert('❌ Invalid URL. Must start with https://script.google.com');
  }
  return false;
}

async function saveToSheet() {
  const btn = document.getElementById('sheetBtn');
  const status = document.getElementById('sheetStatus');

  function setStatus(type, html) {
    status.className = `sheet-status visible ${type}`;
    status.innerHTML = html;
  }

  // Ask for URL if not set
  if (!SCRIPT_URL) {
    const ok = promptScriptUrl();
    if (!ok) return;
  }

  btn.disabled = true;
  btn.style.opacity = '0.6';
  setStatus('loading', '⏳ Submitting to Google Sheet...');

  try {
    // Google Apps Script redirects POST → must use no-cors + form body
    // We send data as a URL param on a GET so the redirect works cleanly
    const url = new URL(SCRIPT_URL);
    url.searchParams.set('payload', JSON.stringify(answers));

    await fetch(url.toString(), { method: 'GET', mode: 'no-cors' });

    // no-cors means we can't read the response — but if we got here without throwing, it worked
    setStatus('success',
      `✅ Submitted to Google Sheet! ` +
      `<span style="opacity:0.7;font-size:12px;">` +
      `<a href="#" class="sheet-link" onclick="promptScriptUrl();return false;">Change Sheet URL</a></span>`
    );
    btn.innerHTML = '✅ Saved to Sheet';

  } catch (err) {
    let msg = `❌ Failed: ${err.message}`;
    if (err.message?.includes('Failed to fetch') || err.message?.includes('NetworkError')) {
      msg = '❌ Could not reach the Apps Script URL. Make sure it is deployed as "Anyone" access. <a href="#" class="sheet-link" onclick="promptScriptUrl();return false;">Update URL</a>';
    }
    setStatus('error', msg);
    btn.disabled = false;
    btn.style.opacity = '';
    btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" fill="#0F9D58"/><path d="M7 8h10M7 12h10M7 16h6" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg> Save to Google Sheet`;
  }
}

function updateProgress() {
  const total = SECTIONS.length;
  const done = SECTIONS.filter(sec => sec.questions.some(q => answers[q.id])).length;
  document.getElementById('progressFill').style.width = (done/total*100)+'%';
  document.getElementById('progressCount').textContent = `${done} / ${total}`;
}

// Init
buildAll();
updateProgress();
</script>
